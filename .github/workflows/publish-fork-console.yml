name: Publish Fork Console

# Fork-only pipeline. services/console is the only forked Centaur service, so the
# fork just needs to build and publish that one image; every other service is
# pinned to upstream GHCR by the provisioner. This runs on standard
# GitHub-hosted runners (no Depot project/org runners, unlike the upstream
# publish-images.yml), so it works from the fork with only GITHUB_TOKEN.

on:
  push:
    branches: [smb-console-mvp]
    paths:
      - services/console/**
      - .github/workflows/publish-fork-console.yml
  workflow_dispatch:

concurrency:
  group: publish-fork-console-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  # Resolves to ghcr.io/<owner>/centaur/centaur-console; metadata-action
  # lowercases the owner (HugoSanchez -> hugosanchez).
  IMAGE: ${{ github.repository_owner }}/centaur/centaur-console

jobs:
  build-and-push:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE }}
          # sha-<short> is the tag the provisioner pins via CONSOLE_IMAGE_TAG.
          tags: |
            type=sha
            type=ref,event=branch
          labels: |
            org.opencontainers.image.title=centaur-console
            org.opencontainers.image.source=https://github.com/${{ github.repository }}

      - name: Build and push (linux/amd64)
        uses: docker/build-push-action@v6
        with:
          # The console Dockerfile builds from its own subdirectory context.
          context: services/console
          file: services/console/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        run: |
          {
            echo "### Published fork console image"
            echo ""
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
            echo ""
            echo "Deploy with:"
            echo '```bash'
            echo "CONSOLE_IMAGE_REPO=${{ env.REGISTRY }}/${{ env.IMAGE }} \\"
            echo "CONSOLE_IMAGE_TAG=sha-$(echo ${{ github.sha }} | cut -c1-7) \\"
            echo "  scripts/provision-lightsail-instance.sh INSTANCE_SLUG"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
